databaseChangeLog:
  - changeSet:
      id: 002-create-employees-table-2026-10-20
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: phone_number
                  type: VARCHAR(20)

              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: salary
                  type: DECIMAL(6, 2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false

              - column:
                  name: department_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_employee_department
                    references: departments(id)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP