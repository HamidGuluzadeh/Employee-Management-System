databaseChangeLog:
  - changeSet:
      id: 001-create-departments-table-2026-10-20
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP